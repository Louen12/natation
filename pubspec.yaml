name: natation
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.0
  provider: ^6.1.5+1
  sensors_plus: ^7.0.0
  flutter_tts: ^4.0.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/play.svg
    - assets/stop.svg
    - assets/gif.svg
    - assets/arret.svg
    - assets/db.json
  fonts:
    - family: DynaPuff
      fonts:
        - asset: assets/fonts/DynaPuff-Regular.ttf
        - asset: assets/fonts/DynaPuff-Bold.ttf
    
