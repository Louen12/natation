name: natation
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  geolocator: ^13.0.1
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - maquette/guepard.png
    - maquette/mesange.png
    - maquette/giphy.gif
    - entrainement.json
    - maquette/success.gif
    - maquette/clash-royale-boohoo.gif

  fonts:
    - family: DynaPuff
      fonts:
        - asset: fonts/DynaPuff-VariableFont_wdth,wght.ttf