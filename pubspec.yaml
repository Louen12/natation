name: natation
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.5.3
  sensors_plus: ^7.0.0
  audioplayers: ^6.5.1
  flutter_tts: ^4.2.3
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/guepard.png
    - assets/images/mesange.png
    - assets/images/giphy.gif
    - entrainement.json
    - assets/db.json
    - assets/audios/beep.mp3
    - assets/images/checked.png
    - assets/images/success.gif
    - assets/images/clash-royale-boohoo.gif

  fonts:
    - family: DynaPuff
      fonts:
        - asset: fonts/DynaPuff-VariableFont_wdth,wght.ttf
