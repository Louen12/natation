name: natation
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/play.svg
    - assets/stop.svg
    - assets/gif.svg
    - assets/arret.svg
  fonts:
    - family: DynaPuff
      fonts:
        - asset: fonts/DynaPuff-Regular.ttf
        - asset: fonts/DynaPuff-Bold.ttf
          weight: 700
