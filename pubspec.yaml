name: natation
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.2
  flutter_riverpod: ^2.5.1
  flutter_tts: ^4.2.3
  latlong2: ^0.9.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  sqflite_common_ffi_web: ^1.0.1+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db.json
    - assets/images/
    - assets/data/
  fonts:
    - family: DynaPuff
      fonts:
        - asset: assets/fonts/DynaPuff-Regular.ttf
        - asset: assets/fonts/DynaPuff-Bold.ttf
          weight: 700
