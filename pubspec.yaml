name: natation
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  geolocator: ^13.0.1
  latlong2: ^0.9.1
  sensors_plus: ^5.0.0
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/guepard.png
    - assets/images/mesange.png
    - assets/images/giphy.gif
    - entrainement.json
    - assets/images/success.gif
    - assets/images/clash-royale-boohoo.gif

  fonts:
    - family: DynaPuff
      fonts:
        - asset: fonts/DynaPuff-VariableFont_wdth,wght.ttf