name: natation
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - maquette/
  fonts:
    - family: DynaPuff
      fonts:
        - asset: fonts/DynaPuff-Regular.ttf
        - asset: fonts/DynaPuff-Bold.ttf
          weight: 700
